{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <title>Esqueci minha senha — Rainwatch</title>
  <link rel="stylesheet" href="{% static 'usuarios/css/esqueci_senha.css' %}"/>
</head>
<body>
<div class="card">
  <h1 class="card-title">Recuperar Senha</h1>
  <form method="post">
    {% csrf_token %}
    <div class="field">
      <label for="email">Digite seu email</label>
      <input type="email" id="email" name="email" required>
    </div>
    <button type="submit" class="btn btn-primary">Enviar link de redefinição</button>
  </form>

  <div class="links">
    <a href="{% url 'usuarios:login' %}">← Voltar para Login</a>
  </div>

  {% if messages %}
    <div class="messages">
      {% for msg in messages %}
        <div class="msg msg-{{ msg.tags }}">{{ msg }}</div>
      {% endfor %}
    </div>
  {% endif %}
</div>
</body>
</html>
