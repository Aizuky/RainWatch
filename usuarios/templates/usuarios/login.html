{% extends "usuarios/base_auth.html" %}
{% load static %}

{% block title %}Login{% endblock %}
{% block header %}Login{% endblock %}

{% block form_fields %}
  <div class="form-group">
    <input type="text" name="usuario" placeholder="Usuário ou Email" required/>
  </div>
  <div class="form-group senha-group">
    <input type="password" name="senha" placeholder="Senha" required id="senha_login"/>
    <button type="button" onclick="toggleSenha('senha_login')" 
            style="position:absolute;right:8px;top:50%;transform:translateY(-50%);
                   background:none;border:none;cursor:pointer;color:black(--text2)">
      👁
    </button>
  </div>
  <div class="form-group">
    <label>
      <input type="checkbox" name="lembrar"/> Lembrar de mim
    </label>
  </div>
{% endblock %}

{% block button_text %}Confirmar Login{% endblock %}

{% block links %}
  <a href="{% url 'usuarios:cadastro' %}">Criar conta</a>
  <a href="{% url 'usuarios:esqueci_senha' %}">Esqueci minha senha</a>
{% endblock %}
